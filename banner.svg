<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>

    <!-- Circular Mask -->
    <clipPath id="circleClip">
      <circle cx="150" cy="150" r="90"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" />

  <!-- EMBEDDED PROFILE PHOTO -->
  <image
    x="60"
    y="60"
    width="180"
    height="180"
    clip-path="url(#circleClip)"
    href="https://github.com/Arnnabchakra/Arnnabchakra/blob/main/profile.jpg"
  />

  <!-- White Border -->
  <circle cx="150" cy="150" r="92"
          fill="none" stroke="white" stroke-width="4"/>

  <!-- Text -->
  <text x="420" y="135" fill="white"
        font-size="46"
        font-family="Segoe UI, sans-serif"
        font-weight="700">
    Hi, I'm Arnnab Chakra 👋
  </text>

  <text x="420" y="180" fill="#d1e8ff"
        font-size="26"
        font-family="Segoe UI, sans-serif">
    Data Scientist | ML Engineer | AI Explorer
  </text>

</svg>
